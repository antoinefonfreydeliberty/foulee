            e('div',{key:i,style:{flex:1,padding:'8px 3px',borderRadius:9,textAlign:'center',cursor:'pointer',background:i===4?t.a:t.s2,color:i===4?'white':t.sub,fontSize:10,fontWeight:i===4?700:500,border:`1px solid ${i===4?t.a:t.border}`}},l)
          )
        )
      ),
      e('div',{style:{margin:'0 14px 9px',background:t.s1,borderRadius:16,padding:'13px 14px',border:`1px solid ${t.border}`}},
        e('p',{style:{color:t.text,fontSize:12,fontWeight:700,margin:'0 0 10px'}},'🔥 Motivation'),
        e('div',{style:{display:'flex',gap:4}},
          ...['😞','😐','🙂','😄','🚀'].map((em,i)=>
            e('div',{key:i,style:{flex:1,padding:'9px 3px',borderRadius:9,textAlign:'center',fontSize:17,cursor:'pointer',background:i===4?t.as:t.s2,border:`1px solid ${i===4?t.a:t.border}`}},em)
          )
        )
      ),
      e('div',{style:{margin:'0 14px 9px',background:t.s1,borderRadius:16,padding:'13px 14px',border:`1px solid ${t.border}`}},
        e('p',{style:{color:t.text,fontSize:12,fontWeight:700,margin:'0 0 10px'}},'🦵 Ressenti physique'),
        e('div',{style:{display:'flex',flexWrap:'wrap',gap:6}},
          ...['Jambes lourdes','Douleur genou G.','RAS','Fatigue muscu.','En pleine forme'].map((tag,i)=>
            e('div',{key:i,style:{padding:'6px 11px',borderRadius:99,fontSize:10,fontWeight:500,cursor:'pointer',background:i===2||i===4?t.as:t.s2,color:i===2||i===4?t.a:t.sub,border:`1px solid ${i===2||i===4?t.a:t.border}`}},tag)
          )
        )
      ),
      e('div',{style:{margin:'0 14px 10px',background:t.s1,borderRadius:12,padding:'11px 13px',minHeight:52,border:`1px solid ${t.border}`,color:t.muted,fontSize:12}},'Note libre : ressenti, doutes, objectifs…'),
      e('div',{style:{padding:'0 14px 24px'}},
        e('div',{style:{background:t.a,borderRadius:13,padding:14,textAlign:'center',color:'white',fontSize:14,fontWeight:800,cursor:'pointer',boxShadow:`0 6px 20px ${t.as}`}},'Envoyer à Marc →')
      )
    );
  }

  // ── CHAT COACH ──────────────────────────────────────────────────
  chat(t) {
    const e=React.createElement;
    const msgs=[
      {from:'marc',text:"Bonjour Antoine ! Je viens d'analyser ton check-in. Tu te sens au top — parfait pour démarrer la semaine 1 avec énergie.",time:'9:02'},
      {from:'me',text:"Merci Marc. J'ai une question sur l'allure de mercredi — tu veux que je reste vraiment à 6'30\" même si je me sens bien ?",time:'9:08'},
      {from:'marc',text:"Oui, absolument. La zone 2 c'est la fondation. Courir trop vite maintenant, c'est hypothéquer les semaines 6 à 10. Fais confiance au processus.",time:'9:09'},
      {from:'marc',text:"Pour te repérer : tu dois pouvoir parler sans être essoufflé. Si tu as du mal à finir tes phrases, tu vas trop vite. 🎯",time:'9:09'},
      {from:'me',text:"D'accord, je comprends mieux. Et pour la sortie longue samedi, c'est la même logique ?",time:'9:11'},
      {from:'marc',text:"Exactement. 12 km en Z1-Z2, allure libre entre 6'15\" et 6'45\". L'objectif c'est juste de mettre du temps sur les jambes sans créer de fatigue résiduelle.",time:'9:12'},
    ];
    const quick=['Adapter mon plan','Douleur au genou','Nutrition avant course','Mon allure cible'];
    return e('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},

      // Header coach
      e('div',{style:{padding:'8px 16px 10px',borderBottom:`1px solid ${t.border}`,background:t.s1,flexShrink:0}},
        e('div',{style:{display:'flex',alignItems:'center',gap:10}},
          e('div',{style:{position:'relative',flexShrink:0}},
            e('div',{style:{width:40,height:40,borderRadius:'50%',background:t.a,display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontSize:16,fontWeight:900,boxShadow:`0 3px 10px ${t.as}`}},'M'),
            e('div',{style:{position:'absolute',bottom:1,right:1,width:10,height:10,borderRadius:'50%',background:'#22C55E',border:`2px solid ${t.s1}`}})
          ),
          e('div',{style:{flex:1}},
            e('p',{style:{color:t.text,fontSize:14,fontWeight:800,margin:'0 0 1px',letterSpacing:-0.3}},'Marc'),
            e('p',{style:{color:'#22C55E',fontSize:11,margin:0,fontWeight:600}},'En ligne · Coach IA Foulée')
          ),
          e('div',{style:{display:'flex',gap:8}},
            e('div',{style:{width:34,height:34,borderRadius:'50%',background:t.s2,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}},
              e('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:t.sub,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
                e('path',{d:'M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013 5.18 2 2 0 014.99 3h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L9.09 10a16 16 0 006.29 6.29l1.36-1.36a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z'})
              )
            )
          )
        )
      ),

      // Messages
      e('div',{style:{flex:1,overflowY:'auto',padding:'14px 14px 10px',display:'flex',flexDirection:'column',gap:10}},
        ...msgs.map((m,i)=>{
          const isMe=m.from==='me';
          return e('div',{key:i,style:{display:'flex',flexDirection:isMe?'row-reverse':'row',gap:7,alignItems:'flex-end'}},
            !isMe&&e('div',{style:{width:28,height:28,borderRadius:'50%',background:t.a,display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontSize:11,fontWeight:900,flexShrink:0,marginBottom:2}},'M'),
            e('div',{style:{maxWidth:'75%',display:'flex',flexDirection:'column',gap:2,alignItems:isMe?'flex-end':'flex-start'}},
              e('div',{style:{
                background:isMe?t.a:t.s1,
                color:isMe?'white':t.text,
                borderRadius:isMe?'18px 18px 4px 18px':'18px 18px 18px 4px',
                padding:'10px 13px',
                fontSize:12,lineHeight:1.5,fontWeight:400,
                border:isMe?'none':`1px solid ${t.border}`,
                boxShadow:isMe?`0 3px 10px ${t.as}`:'none',
              }},m.text),
              e('span',{style:{color:t.muted,fontSize:10,padding:'0 4px'}},m.time)
            )
          );
        }),

        // Typing indicator
        e('div',{style:{display:'flex',gap:7,alignItems:'flex-end'}},
          e('div',{style:{width:28,height:28,borderRadius:'50%',background:t.a,display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontSize:11,fontWeight:900,flexShrink:0}},'M'),
          e('div',{style:{background:t.s1,border:`1px solid ${t.border}`,borderRadius:'18px 18px 18px 4px',padding:'12px 16px',display:'flex',gap:4,alignItems:'center'}},
            ...[0,1,2].map(i=>e('div',{key:i,style:{
              width:6,height:6,borderRadius:'50%',background:t.muted,
              animation:'bounce 1.2s ease-in-out infinite',
              animationDelay:`${i*0.15}s`,
            }}))
          )
        )
      ),

      // Suggestions rapides
      e('div',{style:{padding:'8px 14px 6px',display:'flex',gap:6,overflowX:'auto',flexShrink:0}},
        ...quick.map((q,i)=>
          e('div',{key:i,style:{padding:'7px 13px',borderRadius:99,fontSize:11,fontWeight:600,flexShrink:0,cursor:'pointer',background:t.s1,color:t.a,border:`1px solid ${t.a}44`,whiteSpace:'nowrap'}},q)
        )
      ),

      // Zone de saisie
      e('div',{style:{padding:'8px 14px 12px',borderTop:`1px solid ${t.border}`,background:t.s1,flexShrink:0}},
        e('div',{style:{display:'flex',gap:8,alignItems:'center',background:t.s2,borderRadius:99,padding:'8px 8px 8px 16px',border:`1px solid ${t.border}`}},
          e('span',{style:{flex:1,color:t.muted,fontSize:13}},'Écris à Marc…'),
          e('div',{style:{display:'flex',gap:6,alignItems:'center'}},
            e('div',{style:{width:34,height:34,borderRadius:'50%',background:t.s3,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}},
              e('svg',{width:15,height:15,viewBox:'0 0 24 24',fill:'none',stroke:t.sub,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
                e('path',{d:'M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z'}),
                e('path',{d:'M19 10v2a7 7 0 01-14 0v-2'}),
                e('path',{d:'M12 19v4'}),
                e('path',{d:'M8 23h8'})
              )
            ),
            e('div',{style:{width:34,height:34,borderRadius:'50%',background:t.a,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',boxShadow:`0 3px 10px ${t.as}`}},
              e('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'none',stroke:'white',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
                e('path',{d:'M22 2L11 13'}),
                e('path',{d:'M22 2l-7 20-4-9-9-4 20-7z'})
              )
            )
          )
        )
      )
    );
  }

  // ── Rendu d'un écran ────────────────────────────────────────────
  screen(t) {
    const {s}=this.state;
    if(s===0) return this.bilan(t);
    if(s===1) return this.conseils(t);
    if(s===2) return this.groupe(t);
    if(s===3) return this.rapports(t);
    if(s===4) return this.checkin(t);
    if(s===5) return this.chat(t);
    return null;
  }

  // ── Téléphone ───────────────────────────────────────────────────
  phone(t) {
    const e=React.createElement;
    return e('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:10}},
      e('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:4}},
        e('div',{style:{width:8,height:8,borderRadius:'50%',background:t.a,flexShrink:0}}),
        e('span',{style:{color:'#EDF0FF',fontSize:13,fontWeight:700,letterSpacing:-0.3,whiteSpace:'nowrap'}},t.label)
      ),
      e('div',{style:{
        width:340,height:680,borderRadius:44,
        background:t.bg,
        border:`1px solid ${t.border}`,
        boxShadow:'0 40px 80px rgba(0,0,0,0.6)',
        display:'flex',flexDirection:'column',overflow:'hidden',position:'relative',
      }},
        this.sb(t),
        this.screen(t),
        this.bnav(t),
        e('div',{style:{height:20,background:t.nav,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
          e('div',{style:{width:90,height:4,background:t.muted,borderRadius:99}})
        )
      )
    );
  }

  renderVals() {
    const e=React.createElement;
    const {s}=this.state;
    const t=this.T[1]; // Studio · Jour
    const nav=e('div',{style:{display:'flex',gap:6,justifyContent:'center',flexWrap:'wrap',marginBottom:4}},
      ...this.labels.map((l,i)=>
        e('button',{key:i,onClick:()=>this.setState({s:i}),style:{
          padding:'8px 20px',borderRadius:99,fontSize:12,fontWeight:i===s?700:500,cursor:'pointer',
          background:i===s?t.a:'#FFFFFF',color:i===s?'white':'#6E5E55',
          border:`1px solid ${i===s?t.a:'#DDD7CE'}`,
          transition:'all 0.15s',
          boxShadow: i===s?`0 4px 12px ${t.as}`:'none',
        }},l)
      )
    );
    return {
      nav,
      phoneA: this.phone(this.T[1]),
      phoneB: null,
    };
  }
}

</script>
